apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriplan-k8s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Maksonchyks/DevOps.git'
    targetRevision: feature/kubectl-only
    path: k8s
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nutriplan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
